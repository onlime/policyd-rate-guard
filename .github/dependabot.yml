version: 2
updates:
  # uv.lock; the hash-pinned requirements.txt must be re-exported (the Security workflow fails until it is)
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ['*']
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    directories: [/, /docker/postfix]
    schedule:
      interval: weekly
