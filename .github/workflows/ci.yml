name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - run: uv sync --locked --python 3.13
      - name: Lint
        run: |
          uv run --no-sync ruff format --check .
          uv run --no-sync ruff check --output-format=github .
      - name: Type check
        run: uv run --no-sync mypy

  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.13', '3.14']
        db: ['mysql:8.4', 'mysql:9.7', 'mariadb:12.3']
    services:
      db:
        image: ${{ matrix.db }}
        env:
          MYSQL_ROOT_PASSWORD: test
          MARIADB_ROOT_PASSWORD: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest || mariadb-admin ping -h 127.0.0.1 -uroot -ptest"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      TEST_DATABASE_URL: mysql://root:test@127.0.0.1:3306
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - run: uv sync --locked --python ${{ matrix.python }}
      - name: Tests with coverage
        run: uv run --no-sync pytest --cov --cov-report=term
      - name: Concurrency tests, repeated
        run: |
          for _ in $(seq 5); do
            uv run --no-sync pytest -q tests/test_ratelimit.py -k "concurrent or real_database"
          done
