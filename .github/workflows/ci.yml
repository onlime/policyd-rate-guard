name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    - cron: '41 4 * * 1'  # weekly: new advisories (pip-audit) and new patch releases of the dependencies

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: pip install --group dev -e .
      - name: Lint
        run: |
          ruff format --check .
          ruff check --output-format=github .
      - name: Type check
        run: mypy
      - name: Known vulnerabilities in the dependencies
        run: pip install pip-audit && pip-audit .

  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.13']
        db: ['mysql:8.4', 'mysql:9.7', 'mariadb:12.3']
        include:
          - python: '3.14'
            db: 'mysql:8.4'
    services:
      db:
        image: ${{ matrix.db }}
        env:
          MYSQL_ROOT_PASSWORD: test
          MARIADB_ROOT_PASSWORD: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest || mariadb-admin ping -h 127.0.0.1 -uroot -ptest"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      TEST_DATABASE_URL: mysql://root:test@127.0.0.1:3306
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install --group dev -e .
      - name: Tests with coverage
        run: pytest --cov --cov-report=term
