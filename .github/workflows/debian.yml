# Deployment parity: install and test exactly like the Ansible role does on Debian 13 (Debian's Python, a venv
# with hash-pinned binary wheels, the app via a .pth file), and verify the systemd units with Debian's systemd.
name: Debian 13

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  debian:
    runs-on: ubuntu-24.04
    container: debian:trixie
    services:
      db:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      TEST_DATABASE_URL: mysql://root:test@db:3306
    steps:
      - name: Install Debian packages
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends python3 python3-venv ca-certificates git systemd
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - name: Install like production
        run: |
          python3 -m venv /opt/policyd-rate-guard/venv
          /opt/policyd-rate-guard/venv/bin/pip install --disable-pip-version-check \
            --require-hashes --only-binary=:all: --no-deps -r requirements.txt
          purelib=$(/opt/policyd-rate-guard/venv/bin/python -c 'import sysconfig; print(sysconfig.get_path("purelib"))')
          echo "$PWD/src" > "$purelib/policyd-rate-guard.pth"
          /opt/policyd-rate-guard/venv/bin/python -m policyd_rate_guard --version
      - name: Install test dependencies (hash-pinned)
        run: |
          uv export --frozen --only-group dev --no-emit-project -o /tmp/dev-requirements.txt
          /opt/policyd-rate-guard/venv/bin/pip install --disable-pip-version-check \
            --require-hashes --only-binary=:all: --no-deps -r /tmp/dev-requirements.txt
      - name: Tests on Debian's Python
        run: /opt/policyd-rate-guard/venv/bin/python -m pytest -p no:cacheprovider
      - name: Verify systemd units
        run: |
          useradd --system --no-create-home --shell /usr/sbin/nologin policyd-rate-guard
          cp deployment/systemd/* /etc/systemd/system/
          systemd-analyze verify /etc/systemd/system/policyd-rate-guard.socket \
            /etc/systemd/system/policyd-rate-guard.service \
            /etc/systemd/system/policyd-rate-guard-cleanup.service \
            /etc/systemd/system/policyd-rate-guard-cleanup.timer
          for unit in policyd-rate-guard.service policyd-rate-guard-cleanup.service; do
            systemd-analyze security --offline=true --threshold=20 --no-pager "/etc/systemd/system/$unit" | tail -1
          done
