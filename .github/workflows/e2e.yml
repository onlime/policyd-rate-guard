# End-to-end tests through a real Postfix (Debian 13) with SASL, see docker-compose.yml. Run manually.
name: E2E

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: pip install --group dev -e .
      - name: Start the stack
        run: docker compose up --detach --build --wait
      - name: End-to-end tests
        env:
          E2E_SMTP_PORT: '1587'
          E2E_DATABASE_URL: mysql://root:test@127.0.0.1:13312/policyd-rate-guard
          E2E_WEBHOOK_URL: http://127.0.0.1:18080
        run: pytest -p no:cacheprovider tests/e2e
      - name: Logs
        if: always()
        run: docker compose logs --no-color policyd postfix
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
