name: Security

on:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    - cron: '41 4 * * 1'

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - name: uv.lock is up to date
        run: uv lock --check
      - name: requirements.txt matches uv.lock
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt -o requirements.txt
          git diff --exit-code requirements.txt
      - name: Known vulnerabilities (pip-audit)
        run: uvx --from 'pip-audit>=2.9' pip-audit --require-hashes --disable-pip --strict -r requirements.txt

  workflows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - name: actionlint
        run: uvx --from 'actionlint-py>=1.7' actionlint
      - name: zizmor
        run: uvx 'zizmor>=1.16' --persona=regular .github/workflows
