# Development and end-to-end test stack:
#   db       MySQL 8.4 (host port 13312)
#   migrate  applies the yoyo migrations, then exits
#   policyd  the daemon (host port 10033), configured by .env.docker
#   postfix  Postfix 3.10 (Debian 13) with Cyrus SASL users test01..test03@example.com / Example1234,
#            submission on host port 1587, all accepted mail is discarded
#   webhook  records webhook calls (host port 18080, GET /calls)
#
#   docker compose up -d --build --wait
#   E2E_SMTP_PORT=1587 E2E_DATABASE_URL=mysql://root:test@127.0.0.1:13312/policyd-rate-guard \
#     E2E_WEBHOOK_URL=http://127.0.0.1:18080 uv run pytest tests/e2e
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: test
      MYSQL_DATABASE: policyd-rate-guard
      MYSQL_USER: policyd-rate-guard
      MYSQL_PASSWORD: Example1234
      MYSQL_INITDB_SKIP_TZINFO: 'yes'
    ports:
      - 127.0.0.1:13312:3306
    healthcheck:
      test: [CMD, mysqladmin, ping, -h, 127.0.0.1, -uroot, -ptest]
      interval: 2s
      timeout: 5s
      retries: 60

  migrate:
    build: .
    command:
      - /opt/policyd-rate-guard/venv/bin/yoyo
      - apply
      - --batch
      - --database
      - mysql://policyd-rate-guard:Example1234@db/policyd-rate-guard
      - /opt/policyd-rate-guard/database/migrations
    depends_on:
      db:
        condition: service_healthy

  policyd:
    build: .
    env_file: .env.docker
    ports:
      - 127.0.0.1:10033:10033
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, /opt/policyd-rate-guard/venv/bin/python, -m, policyd_rate_guard, check]
      interval: 2s
      timeout: 5s
      retries: 30

  postfix:
    build: docker/postfix
    ports:
      - 127.0.0.1:1587:587
    depends_on:
      policyd:
        condition: service_healthy
    healthcheck:
      test: [CMD, postfix, status]
      interval: 2s
      timeout: 5s
      retries: 30

  webhook:
    image: python:3.13-slim
    command: [python, /webhook_receiver.py]
    volumes:
      - ./docker/webhook_receiver.py:/webhook_receiver.py:ro
    ports:
      - 127.0.0.1:18080:8080
