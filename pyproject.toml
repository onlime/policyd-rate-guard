[project]
name = "policyd-rate-guard"
dynamic = ["version"]
description = "A slick sender rate limit policy daemon for Postfix, written in Python."
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [
    { name = "Onlime GmbH", email = "info@onlime.ch" },
]
requires-python = ">=3.13"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: No Input/Output (Daemon)",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Email :: Filters",
    "Topic :: Communications :: Email :: Mail Transport Agents",
]
keywords = ["postfix", "policy", "rate limit", "smtp", "email"]
dependencies = [
    "DBUtils==3.2.*",
    "PyJWT==2.15.*",
    # rsa: cryptography, for caching_sha2_password authentication over TCP
    "PyMySQL[rsa]==1.2.*",
    "python-dotenv==1.2.*",
    "requests==2.34.*",
    "sentry-sdk==2.74.*",
    "yoyo-migrations==9.0.*",
]

[project.urls]
Homepage = "https://github.com/onlime/policyd-rate-guard"
Changelog = "https://github.com/onlime/policyd-rate-guard/blob/main/CHANGELOG.md"
Issues = "https://github.com/onlime/policyd-rate-guard/issues"

[project.scripts]
policyd-rate-guard = "policyd_rate_guard.cli:main"

# pip install --group dev -e .
[dependency-groups]
dev = [
    "mypy==2.4.*",
    "pytest==9.2.*",
    "pytest-asyncio==1.4.*",
    "pytest-cov==7.1.*",
    "ruff==0.17.*",
    "types-PyMySQL==1.2.*",
    "types-requests==2.33.*",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "policyd_rate_guard.__version__" }

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle, pyflakes
    "I",            # isort
    "UP",           # pyupgrade
    "B",            # bugbear
    "S",            # bandit (security)
]
ignore = [
    "S608",  # SQL is built from constants only, values are always bound parameters
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311"]

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
python_version = "3.13"
platform = "linux"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["dbutils.*", "yoyo.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "db: needs a MySQL/MariaDB server (TEST_DATABASE_URL)",
    "e2e: needs the docker compose stack with a real Postfix (E2E_SMTP_HOST)",
]
filterwarnings = [
    # yoyo-migrations 9.0 still passes db= and passwd= to PyMySQL
    "ignore:'db' is deprecated, use 'database':DeprecationWarning",
    "ignore:'passwd' is deprecated, use 'password':DeprecationWarning",
]

[tool.coverage.run]
source = ["policyd_rate_guard"]
branch = true
patch = ["subprocess"]  # also measure the daemon started by the CLI tests

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 95
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
